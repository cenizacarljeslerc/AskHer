<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Daisy 💖</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    background: #ffe4ef;
    font-family: 'Comic Sans MS', cursive;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.card {
    text-align: center;
    padding: 20px;
    width: 100%;
    max-width: 480px;
}

.bunny {
    width: 260px;
    max-width: 90%;
}

h1 {
    color: #ff5c8a;
    font-size: 34px;
    margin: 10px 0 25px;
}

.buttons {
    position: relative;
    height: 120px;
}

button {
    border: none;
    border-radius: 50px;
    padding: 16px 46px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    position: absolute;
    transition: transform 0.2s ease, left 0.2s ease, top 0.2s ease;
}

/* YES BUTTON */
#yes {
    background: linear-gradient(145deg, #ff5c8a, #ff8fb3);
    color: white;
    left: 18%;
    box-shadow: 0 8px 0 #d93f6c;
}

/* NO BUTTON */
#no {
    background: linear-gradient(145deg, #ffffff, #ececec);
    color: #666;
    right: 18%;
    box-shadow: 0 8px 0 #cfcfcf;
}

/* floating hearts */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 22px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {transform: translateY(0); opacity: 1;}
    100% {transform: translateY(-110vh); opacity: 0;}
}

/* popup */
.popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    justify-content: center;
    align-items: center;
}

.popup-box {
    background: white;
    padding: 35px 40px;
    border-radius: 25px;
    text-align: center;
    animation: pop 0.25s ease;
}

@keyframes pop {
    0% {transform: scale(0.6);}
    100% {transform: scale(1);}
}
</style>
</head>

<body>

<div class="card">
    <img src="bunny.png" class="bunny">
    <h1>Daisy, will you be my Valentine? 💕</h1>

    <div class="buttons">
        <button id="yes">YES</button>
        <button id="no">NO</button>
    </div>
</div>

<div class="popup" id="popup">
    <div class="popup-box">
        <h2>YAAAAAY DAISY 😍💖</h2>
        <p>You just made me the happiest person ever 🐰💕</p>
    </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const popup = document.getElementById("popup");

let yesScale = 1; // YES growth
let noDirX = Math.random() > 0.5 ? 1 : -1; // NO horizontal direction
let noDirY = Math.random() > 0.5 ? 1 : -1; // NO vertical direction

function moveNo() {
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    const maxX = window.innerWidth - btnWidth;
    const maxY = window.innerHeight - btnHeight;

    const yesRect = yesBtn.getBoundingClientRect();
    const buffer = 150 * yesScale; // minimum distance from YES

    // Current NO position
    let x = noBtn.offsetLeft;
    let y = noBtn.offsetTop;

    const step = 40; // speed of NO
    x += step * noDirX;
    y += step * noDirY;

    // Bounce off edges
    if (x < 0) { x = 0; noDirX *= -1; }
    if (x > maxX) { x = maxX; noDirX *= -1; }
    if (y < 0) { y = 0; noDirY *= -1; }
    if (y > maxY) { y = maxY; noDirY *= -1; }

    // Push away from YES if too close
    if (Math.abs(x - yesRect.left) < buffer) {
        noDirX = x < yesRect.left ? -1 : 1;
        x += 50 * noDirX;
        x = Math.max(0, Math.min(x, maxX));
    }
    if (Math.abs(y - yesRect.top) < buffer) {
        noDirY = y < yesRect.top ? -1 : 1;
        y += 50 * noDirY;
        y = Math.max(0, Math.min(y, maxY));
    }

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    // Grow YES
    yesScale += 0.15;
    if (yesScale > 3) yesScale = 3;
    yesBtn.style.transform = `scale(${yesScale})`;
}

// Hover or touch triggers NO move
noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", moveNo);

// YES click
yesBtn.addEventListener("click", () => {
    popup.style.display = "flex";
    confetti();
});

/* floating hearts */
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 250);

/* confetti */
function confetti() {
    for (let i = 0; i < 70; i++) {
        const conf = document.createElement("div");
        conf.innerHTML = "🎉";
        conf.style.position = "fixed";
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.top = Math.random() * 100 + "vh";
        conf.style.fontSize = "22px";
        conf.style.animation = "float 3s linear";
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 3000);
    }
}
</script>

</body>
</html>
